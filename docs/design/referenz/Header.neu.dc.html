<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:0 clamp(16px,4vw,64px);min-height:68px;background:#f4f5f2;border-bottom:1px solid #dfe2dd;font-family:Figtree,system-ui,sans-serif;color:#14181b;box-sizing:border-box">
  <a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;font-family:Outfit,Figtree,sans-serif;font-weight:600;font-size:21px;letter-spacing:-0.02em;color:#0f1b22;text-decoration:none">
    <svg width="34" height="24" viewBox="0 0 28 20" fill="none" aria-hidden="true"><path d="M14 3.07A8 8 0 0 1 14 16.93A8 8 0 0 1 14 3.07Z" fill="#4fd1b4"></path><circle cx="10" cy="10" r="8" stroke="#0f1b22" stroke-width="2"></circle><circle cx="18" cy="10" r="8" stroke="#0b7a6a" stroke-width="2"></circle></svg>Reziproq</a>
  <nav aria-label="Hauptnavigation" style="display:flex;flex-wrap:wrap;gap:2px;margin:0 auto;padding:4px;border-radius:999px;background:#eceeea">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">{{item.label}}</a>
    </sc-for>
  </nav>
  <div style="display:flex;align-items:center;gap:10px">
    <sc-if value="{{buyer}}" hint-placeholder-val="{{true}}">
      <a href="Fragen.dc.html" style="display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 8px 0 14px;border-radius:999px;background:#ffffff;box-shadow:inset 0 0 0 1px #dfe2dd;color:#3f4a52;text-decoration:none;font-size:14px;font-weight:500">
        <svg width="22" height="16" viewBox="0 0 28 20" fill="none" aria-hidden="true"><path d="M14 3.07A8 8 0 0 1 14 16.93A8 8 0 0 1 14 3.07Z" fill="#4fd1b4"></path><circle cx="10" cy="10" r="8" stroke="#0f1b22" stroke-width="2"></circle><circle cx="18" cy="10" r="8" stroke="#0b7a6a" stroke-width="2"></circle></svg>Suchen oder Reziproq fragen<span style="padding:3px 8px;border-radius:8px;background:#f4f5f2;font-size:12px;font-weight:600;color:#5a636b">⌘K</span></a>
    </sc-if>
    <a href="E-Uebersicht.dc.html" aria-label="{{profileLabel}}" style="width:40px;height:40px;border-radius:999px;background:#0f1b22;color:#4fd1b4;display:flex;align-items:center;justify-content:center;font:600 13px Outfit,Figtree,sans-serif;letter-spacing:.02em;text-decoration:none">{{initials}}</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Übersicht","Mein Tag","Lieferanten","Warengruppen","Kunden","Keine","Start","Portfolio","Wirkung","Agenten"],"default":"Mein Tag"},"side":{"editor":"enum","options":["buyer","supplier"],"default":"buyer"},"$preview":{"width":1440,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    const alias = { Start: 'Mein Tag', Wirkung: 'Übersicht', Portfolio: 'Lieferanten', Agenten: 'Keine' };
    const raw = this.props.active ?? 'Mein Tag';
    const active = alias[raw] ?? raw;
    const supplier = (this.props.side ?? 'buyer') === 'supplier';
    const links = supplier
      ? [['Start', 'K-Start.dc.html'], ['Kunden', 'K-Arbeitsbereich.dc.html']]
      : [['Übersicht', 'Uebersicht.dc.html'], ['Mein Tag', 'Main.dc.html'], ['Lieferanten', 'Lieferanten.dc.html'], ['Warengruppen', 'WG-Uebersicht.dc.html']];
    const base = 'display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-size:15px;';
    return {
      items: links.map(([label, href]) => ({
        label,
        href,
        current: label === active || (supplier && label === raw) ? 'page' : 'false',
        style: label === active || (supplier && label === raw)
          ? base + 'background:#ffffff;color:#0f1b22;font-weight:600;box-shadow:0 1px 2px #0f1b221f'
          : base + 'color:#3f4a52;font-weight:500',
      })),
      buyer: !supplier,
      initials: supplier ? 'KK' : 'JL',
      profileLabel: supplier ? 'Profil Kim Kaiser' : 'Profil und Einstellungen Jan-Luka',
    };
  }
}
</script>
</body>
</html>
