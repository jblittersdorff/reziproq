<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>GroupBar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="font-family:Figtree,system-ui,sans-serif;color:#0f1b22;background:#f4f5f2">
  <div style="max-width:1200px;margin:0 auto;padding:20px clamp(16px,4vw,48px) 4px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box">
    <a href="WG-Uebersicht.dc.html" style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;min-height:32px;color:#0b7a6a;font-size:15px;font-weight:600;text-decoration:none"><svg width="10" height="16" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Warengruppen</a>
    <div style="display:flex;flex-direction:column;gap:4px">
      <strong style="font-family:Outfit,Figtree,sans-serif;font-size:clamp(28px,4vw,36px);line-height:1.08;font-weight:600;letter-spacing:-0.03em">Leiterplatten</strong>
      <span style="font-size:14px;color:#5a636b">8,2 Mio. € · 7 Lieferanten · Lead Sara Ost · Schritt 6 von 10: Bewertung</span>
    </div>
    <nav aria-label="Bereiche der Warengruppe" style="display:flex;gap:2px;padding:3px;border-radius:12px;background:#e6e9e5;overflow-x:auto;max-width:100%;box-sizing:border-box">
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="4">
        <a href="{{a.href}}" aria-current="{{a.current}}" style="{{a.style}}">{{a.label}}</a>
      </sc-for>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"area":{"editor":"enum","options":["Überblick","Strategie","Lieferanten","Ergebnisse"],"default":"Strategie"},"$preview":{"width":1440,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const area = this.props.area ?? 'Strategie';
    const tabs = [['Überblick', 'WG-Start.dc.html'], ['Strategie', 'WG-Aufsetzen.dc.html'], ['Lieferanten', 'WG-SupplierMap.dc.html'], ['Ergebnisse', 'WG-Scorecard.dc.html']];
    const tab = 'display:inline-flex;align-items:center;justify-content:center;flex:1 0 auto;min-height:36px;padding:0 18px;border-radius:9px;text-decoration:none;font-size:14px;white-space:nowrap;';
    return {
      areas: tabs.map(([label, href]) => ({
        label,
        href,
        current: label === area ? 'page' : 'false',
        style: label === area ? tab + 'background:#ffffff;color:#0f1b22;font-weight:600;box-shadow:0 1px 3px #0f1b2222' : tab + 'color:#3f4a52;font-weight:500',
      })),
    };
  }
}
</script>
</body>
</html>
