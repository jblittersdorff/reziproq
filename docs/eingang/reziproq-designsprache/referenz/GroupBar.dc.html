<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>GroupBar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="font-family:Figtree,system-ui,sans-serif;color:#14181b;background:#ffffff;border-bottom:1px solid #dfe2dd">
  <div style="max-width:1200px;margin:0 auto;padding:22px clamp(16px,4vw,48px) 0;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between">
      <a href="WG-Freigabe.dc.html" style="display:flex;align-items:center;gap:16px;text-decoration:none;color:#14181b">
        <span style="width:52px;height:52px;border-radius:999px;background:#0f1b22;color:#4fd1b4;display:flex;align-items:center;justify-content:center;font:600 16px Outfit,Figtree,sans-serif;letter-spacing:.02em">LP</span>
        <span style="display:flex;flex-direction:column;gap:2px">
          <strong style="font-family:Outfit,Figtree,sans-serif;font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-0.025em">Leiterplatten</strong>
          <span style="font-size:13px;color:#5a636b">Warengruppe · 8,2 Mio. € · 7 Lieferanten · Lead Sara Ost</span>
        </span>
      </a>
      <span style="display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;background:#f8eed6;color:#74500a;font-size:13px;font-weight:600">Strategie 2027 · Entwurf</span>
    </div>
    <nav aria-label="Bereiche der Warengruppe" style="display:flex;gap:4px;overflow-x:auto">
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="4">
        <a href="{{a.href}}" aria-current="{{a.current}}" style="{{a.style}}">{{a.label}}</a>
      </sc-for>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"area":{"editor":"enum","options":["Überblick","Strategie","Lieferanten","Ergebnisse"],"default":"Strategie"},"$preview":{"width":1440,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const area = this.props.area ?? 'Strategie';
    const tabs = [['Überblick', 'WG-Freigabe.dc.html'], ['Strategie', 'WG-Aufsetzen.dc.html'], ['Lieferanten', 'WG-SupplierMap.dc.html'], ['Ergebnisse', 'WG-Scorecard.dc.html']];
    const tab = 'display:inline-flex;align-items:center;min-height:48px;padding:0 16px;text-decoration:none;font-size:16px;white-space:nowrap;border-bottom:3px solid ';
    return {
      areas: tabs.map(([label, href]) => ({
        label,
        href,
        current: label === area ? 'page' : 'false',
        style: label === area ? tab + '#0f1b22;color:#0f1b22;font-weight:600' : tab + 'transparent;color:#5a636b;font-weight:500',
      })),
    };
  }
}
</script>
</body>
</html>
